  summary: >
    Teaching Professor at Rensselaer Polytechnic Institute with research expertise in human factors, healthcare systems, transportation safety, workload, stress, burnout, physiological sensing, wearable technologies, eye tracking, simulation, and machine learning. Seven years of research experience, three years as an independent instructor, and four years of industry experience.
