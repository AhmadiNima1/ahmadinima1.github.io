    Experience:
      - company: Rensselaer Polytechnic Institute
        position: Teaching Professor
        start_date: 2022
        end_date: present
        highlights:
          - Teaching and developing undergraduate and graduate courses.
          - Chief Engineer for capstone projects.
          - Leading a team for the HSPI healthcare simulation competition.
      - company: Houston Methodist
        position: Faculty appointment, Department of Anesthesia and Critical Care
        start_date: 2022
        end_date: present
        highlights:
          - Active in ICU-related studies on intensivists and clinical care delivery.
      - company: Houston Methodist
        position: Postdoctoral Fellow
        start_date: 2020
        end_date: 2022
        highlights:
          - Studied burnout and stress among cardiovascular ICU nurses and physicians using wearable technologies.
          - Evaluated nurses' workload and stress using physiological and ocular data.
          - Measured physical activity among ICU nurses using accelerometer data.
          - Studied mindfulness-based stress reduction courses for clinicians' mental health.
          - Developed and evaluated web-based communication tools for patient behavior and compliance.
      - company: Western New England University
        position: Research Assistant
        start_date: 2014
        end_date: 2016
        highlights:
          - Contributed to research on training and behavior assessment.
          - Collaborated on the Engaged Driver Training System for teen drivers.
          - Designed a gaze-based training intervention for student pilots.
          - Analyzed the NTSB aircraft accident database using a Visual Basic.NET application.
      - company: APEC, Tehran, Iran
        position: Project Manager and Coordinator of Piping Department
        start_date: 2010
        end_date: 2014
        highlights:
          - Worked across basic and detailed engineering design.
          - Customized SharePoint for project management.
      - company: COOLSUMMER, Tehran, Iran
        position: Manager of Heat Exchanger Department
        start_date: 2009
        end_date: 2010
        highlights:
          - Led design and repair work for plate heat exchangers.
