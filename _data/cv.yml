cv:
  name: Nima Ahmadi, PhD
  label: Human Factors Engineer & Researcher | Human Performance Analytics | Simulation | Applied AI
  email: ahmadn4@rpi.edu
  website: https://ahmadinima1.github.io
  address:
    city: Clifton Park
    region: NY
  image: ""
  summary: >
    Human factors engineer, researcher, and educator focused on healthcare systems, transportation and aviation safety,
    simulation, physiological and behavioral sensing, and applied AI for human performance. Current work connects clinical
    workflow analysis, multimodal performance data, usability research, and engineering education to improve safety,
    decision support, training, and system design.
  sections:
    Experience:
      - company: Rensselaer Polytechnic Institute
        position: Faculty Member, Department of Industrial and Systems Engineering
        location: Troy, NY
        start_date: 2022
        end_date: present
        highlights:
          - Lead and contribute to research in healthcare human factors, vascular access workflow, multimodal aviation performance assessment, and simulation-based systems analysis.
          - Teach undergraduate and graduate courses in human factors, discrete-event simulation, design of experiments, supply chains, capstone design, and probability/statistics.
          - Mentor multidisciplinary capstone teams and support industry-sponsored engineering design projects, including accessibility and assistive-technology work.
      - company: Houston Methodist
        position: Postdoctoral Fellow, Center for Outcomes Research
        location: Houston, TX
        start_date: 2020
        end_date: 2022
        highlights:
          - Conducted human factors and health-systems research on clinician workload, stress, burnout, tele-critical care, patient engagement, and tailored digital health interventions.
          - Designed and coordinated ICU studies using wearable physiological sensing, eye tracking, surveys, qualitative data, and operational data.
          - Supported UX research and usability evaluation for digital health tools, including patient communication systems and breast-cancer navigation technology.
      - company: Western New England University
        position: Research Assistant, Center for Advanced Training Research and Naturalistic Studies
        location: Springfield, MA
        start_date: 2014
        end_date: 2020
        highlights:
          - Contributed to teen-driver hazard anticipation training research using driving simulation, field assessment, eye tracking, and behavioral analysis.
          - Designed and evaluated gaze-based training for general aviation pilots transitioning from visual flight to instrument meteorological conditions.
          - Built and analyzed human performance datasets across transportation, aviation, and training contexts.
      - company: APEC
        position: Project Manager and Coordinator, Piping Department
        start_date: 2010
        end_date: 2014
        highlights:
          - Managed and coordinated basic and detailed piping-engineering activities for water-treatment and steelmaking plant projects.
          - Prepared and reviewed piping material specifications, line lists, piping and equipment layouts, material take-offs, and technical requisitions.
          - Used AVEVA PDMS for plant layout, routing, equipment arrangement, and design coordination while applying ASME B31.3 and relevant NFPA standards.
      - company: COOLSUMMER
        position: Manager, Heat Exchanger Department
        start_date: 2009
        end_date: 2010
        highlights:
          - Led thermal sizing, rating, selection, and technical evaluation of plate heat exchangers across operating conditions.
          - Selected plate, frame, and gasket materials based on fluid compatibility, temperature, pressure, and corrosion-resistance requirements.
          - Directed assembly, hydrostatic and leak testing, performance verification, troubleshooting, and repair activities.
    Research Highlights / Ongoing Projects:
      - title: Healthcare workflow and vascular access research
        summary: >
          Collaborating with Albany Medical Center on emergency-department vascular access studies involving task analysis,
          procedure duration, catheter utilization, workflow assessment, survival analysis, and ergonomic evaluation.
        keywords:
          - healthcare workflow
          - vascular access
          - task analysis
          - patient safety
      - title: Multimodal aviation performance and stress assessment
        summary: >
          Designing aviation studies that integrate eye tracking, flight-control data, aircraft-state data, performance
          measures, and voice-based stress indicators to evaluate training effects and pilot performance.
        keywords:
          - aviation human factors
          - eye tracking
          - vocal stress
          - machine learning
      - title: Clinician workload, stress, and well-being
        summary: >
          Analyzing healthcare-worker stress, emotional well-being, workload, engagement, and burnout through physiological,
          behavioral, survey, intervention, and operational datasets.
        keywords:
          - ICU nurses
          - wearable sensing
          - well-being
          - mixed-effects modeling
      - title: AI and simulation for decision support
        summary: >
          Developing human-centered approaches that connect simulation, data analytics, generative AI, and cognitive science
          for emergency medicine, training, and engineering education.
        keywords:
          - simulation
          - applied AI
          - decision support
          - engineering education
